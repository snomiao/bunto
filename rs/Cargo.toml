[package]
name = "bunto"
version = "0.0.0"
edition = "2021"
description = "Auto Install Packages and types definitions as you code, ZEN-MODE for ts/js coding."
license = "MIT"

[[bin]]
name = "bunto"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
